# ─────────────────────────────────────────────
# Decap CMS — Configuration ACE-ULB
# ─────────────────────────────────────────────

backend:
  name: git-gateway
  branch: main

# Langue de l'interface
locale: fr

# Dossier où Decap CMS dépose les images uploadées (par défaut)
media_folder: public/static/img/uploads
public_folder: /static/img/uploads

# ─────────────────────────────────────────────
# COLLECTIONS
# ─────────────────────────────────────────────
collections:

  # ── 1. Page d'accueil ───────────────────────
  - name: home
    label: "🏠 Page d'accueil"
    files:
      - name: carousel
        label: "Carrousel de photos"
        file: src/data/home-carousel.json
        format: json
        description: >
          Ajoutez, supprimez ou réordonnez les photos du carrousel
          affiché sur la page d'accueil.
        fields:
          - name: photos
            label: Photos
            label_singular: Photo
            widget: list
            summary: "{{fields.image}}"
            fields:
              - name: image
                label: Image
                widget: image
                media_folder: /public/static/img/home
                public_folder: /static/img/home
                hint: >
                  Format recommandé : PNG ou JPEG, ratio 4:3,
                  minimum 800×600 px.

  # ── 2. Comité de l'année en cours ──────────
  - name: comite
    label: "👥 Comité"
    label_singular: "Année de comité"
    folder: src/assets/comite
    path: "{{year}}/comite"
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: year
    summary: "Comité {{fields.year}}"
    sortable_fields: [year]
    fields:
      - name: year
        label: Année académique
        widget: number
        value_type: int
        hint: "Ex : 2025 pour l'année 2024–2025"

      - name: membres
        label: Membres
        label_singular: Membre
        widget: list
        summary: "{{fields.nom}} — {{fields.poste}}"
        fields:
          - {name: nom,   label: Nom,   widget: string}
          - name: poste
            label: Poste
            widget: string
            hint: >
              Postes habituels : Présidence, Vice-Présidence Externe,
              Vice-Présidence Interne, Trésorerie, Secrétariat,
              Folklore-Trésorerie, Folklore, Bal & Fêtes, Écologie,
              Réduction des Risques, Engagement-Librex, Cantus,
              Web-Communication, Social, Culture, Égalité & Inclusivité.
              Écris le poste exact (tu peux en ajouter librement).
          - name: cercle
            label: Cercle d'origine
            widget: select
            required: false
            options: [Agro, CARé, CD, CEBULB, CECS, CELB, CGéo, CHAA, CI, CIGa, CJC, CKO, CM, CO, CP, CPL, CPS, CPSY, CRom, CS, CdH, CdS, CePHA, Chimacienne, Fronta, ISEP, ISTI, Librex, Liégeoise, Lux, Semeur]
          - name: img
            label: "Photo"
            widget: image
            required: false
            media_folder: public/static/img/comite
            public_folder: /static/img/comite
            hint: "Format recommandé : carré, minimum 300×300 px."
          - name: dem
            label: Démissionnaire·e
            widget: boolean
            required: false
            default: false

  # ── 3. Cercles ──────────────────────────────
  - name: cercles
    label: "🎓 Cercles"
    label_singular: Cercle
    folder: src/assets/cercles/md
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: acronyme
    summary: "{{acronyme}} — {{cercle}}"
    sortable_fields: [acronyme, cercle, date]
    fields:
      - {name: acronyme,   label: Acronyme,          widget: string}
      - {name: cercle,     label: "Nom complet",      widget: string}
      - {name: website,    label: Site web,            widget: string,   required: false}
      - {name: facebook,   label: Facebook,            widget: string,   required: false}
      - {name: instagram,  label: Instagram,           widget: string,   required: false}
      - {name: brief,      label: "Description courte", widget: string}
      - name: baptismal
        label: Cercle baptismal ?
        widget: boolean
        default: false
      - {name: color,      label: Couleur (hex),       widget: color,    required: false}
      - {name: date,       label: "Année de fondation", widget: number,  value_type: int, required: false}

  # ── 4. Guildes ──────────────────────────────
  - name: guildes
    label: "🎵 Guildes"
    label_singular: Guilde
    folder: src/assets/guildes/md
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: acronyme
    summary: "{{acronyme}} — {{cercle}}"
    fields:
      - {name: acronyme,  label: Acronyme,           widget: string}
      - {name: cercle,    label: "Nom complet",       widget: string}
      - {name: facebook,  label: Facebook,             widget: string,  required: false}
      - {name: instagram, label: Instagram,            widget: string,  required: false}
      - {name: brief,     label: "Description courte", widget: string}
      - {name: color,     label: Couleur (hex),        widget: color,   required: false}
